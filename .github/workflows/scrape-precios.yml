name: Scrape Precios Facilito

# Scrapea los precios de combustible de Facilito (Osinergmin) a nivel nacional
# con Playwright y los escribe en MongoDB Atlas. Corre en un runner de GitHub
# (7 GB RAM, gratis en repos públicos) para no cargar el servidor de Render.

on:
  schedule:
    - cron: "0 8 * * *"        # 08:00 UTC = 03:00 Perú (todos los días)
  workflow_dispatch:            # permite dispararlo manualmente desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright motor dnspython python-dotenv
          python -m playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: enered_prod
          # Solo Diésel (subsidio) → nacional ~2h y confiable. Para los 3 combustibles: "DB5 S-50 UV,Gasohol Regular,Gasohol Premium"
          FUELS: "DB5 S-50 UV"
        run: python backend/scrape_facilito_playwright.py
