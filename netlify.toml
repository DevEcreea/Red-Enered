# Netlify config for the React frontend.
# Push this repo to GitHub, then in Netlify: Add new site > Import from Git.
[build]
  base    = "frontend"
  command = "yarn install --frozen-lockfile && yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"
  CI = "false"   # CRA treats warnings as errors otherwise

# Dominio propio (activar el día que enered.pe ya resuelva a Netlify con certificado):
# manda a quien entre por la URL provisional de Netlify a enered.pe, conservando la ruta.
[[redirects]]
  from   = "https://enered.netlify.app/*"
  to     = "https://enered.pe/:splat"
  status = 301
  force  = true

# SPA fallback — all unknown routes go to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Enlace app Android (Trusted Web Activity) ↔ dominio: debe servirse como JSON.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
